# ============================================================
#  CoinShop - Einstellungen
#  Nach Änderungen im Spiel / in der Konsole: /coinsadmin reload
#  Hinweis: Wenn du eine alte config.yml hast, lösche sie einmal
#  (plugins/CoinShop/config.yml), damit diese neue erzeugt wird.
# ============================================================

# ---------------- Erfolge (Achievements) ----------------
# Je schwieriger der Erfolg, desto mehr Coins. So wird die Belohnung bestimmt:
#   1. Steht der Erfolg unter "overrides"            -> genau dieser Betrag
#   2. Steht er in der Liste "advancements" einer Stufe -> Belohnung dieser Stufe
#   3. Sonst nach Art des Erfolgs im Spiel (Aufgabe / Ziel / Herausforderung, siehe type-tiers)
# Erfolge heißen so wie im Spiel, z. B. "minecraft:story/mine_diamond".
# (Namen, die es nicht gibt, schaden nicht - sie werden einfach nie getroffen.)
achievements:
  enabled: true
  # Welche Stufe gilt standardmäßig für welche Art von Erfolg
  type-tiers:
    task: leicht          # normale Aufgabe (eckiges Symbol)
    goal: mittel          # Ziel (abgerundetes Symbol)
    challenge: schwer     # Herausforderung (gezacktes Symbol)
  tiers:
    leicht: {name: "Leicht", reward: 10}
    mittel: {name: "Mittel", reward: 30}
    schwer: {name: "Schwer", reward: 100}
    # Besonders schwierige Erfolge (handverlesen, zählt vor der Art des Erfolgs)
    sehr-schwer:
      name: "Sehr schwer"
      reward: 250
      advancements:
        - "minecraft:end/kill_dragon"
        - "minecraft:end/dragon_egg"
        - "minecraft:end/elytra"
        - "minecraft:end/respawn_dragon"
        - "minecraft:end/dragon_breath"
        - "minecraft:nether/summon_wither"
        - "minecraft:nether/get_wither_skull"
        - "minecraft:nether/create_beacon"
        - "minecraft:nether/netherite_armor"
        - "minecraft:nether/obtain_ancient_debris"
        - "minecraft:nether/uneasy_alliance"
        - "minecraft:nether/ride_strider_in_overworld_lava"
        - "minecraft:adventure/totem_of_undying"
        - "minecraft:adventure/hero_of_the_village"
        - "minecraft:adventure/very_very_frightening"
        - "minecraft:adventure/sniper_duel"
        - "minecraft:adventure/arbalistic"
        - "minecraft:adventure/spyglass_at_dragon"
        - "minecraft:adventure/overoverkill"
        - "minecraft:husbandry/obtain_netherite_hoe"
    extrem:
      name: "Extrem"
      reward: 600
      advancements:
        - "minecraft:adventure/kill_all_mobs"
        - "minecraft:adventure/adventuring_time"
        - "minecraft:adventure/trim_with_all_exclusive_armor_patterns"
        - "minecraft:nether/all_effects"
        - "minecraft:nether/all_potions"
        - "minecraft:nether/create_full_beacon"
        - "minecraft:husbandry/bred_all_animals"
        - "minecraft:husbandry/complete_catalogue"
        - "minecraft:husbandry/balanced_diet"
        - "minecraft:husbandry/leash_all_frog_variants"
        - "minecraft:husbandry/whole_pack"
  # Einzelne Erfolge mit einem festen Betrag (hat Vorrang vor allem anderen). Beispiel:
  overrides:
    # "minecraft:story/mine_diamond": 50

# Geheime Erfolge: Belohnung je nach Schwierigkeit ("tier" ist nur der angezeigte Name der Stufe).
# Namen und Beschreibungen stehen in messages.yml unter "secret".
secret-achievements:
  kleiner-fisch:  {tier: leicht, coins: 20}
  grosser-fisch:  {tier: schwer, coins: 150}
  blumentopf:     {tier: leicht, coins: 10}
  phantom:        {tier: mittel, coins: 40}
  bier:           {tier: mittel, coins: 30}
  fledermaus:     {tier: leicht, coins: 20}
  baby-zombie:    {tier: mittel, coins: 40}
  ei:             {tier: mittel, coins: 50}
  lohenrute:      {tier: schwer, coins: 100}
  baby-villager:  {tier: leicht, coins: 15}
  teppich:        {tier: leicht, coins: 10}
  frosch:         {tier: mittel, coins: 40}
  schwein:        {tier: leicht, coins: 10}
  kante:          {tier: mittel, coins: 50}

# ---------------- Ranglisten ----------------
# Die Zahlen kommen aus den normalen Minecraft-Statistiken (auch von VOR der Plugin-Installation).
# Die Top 5 jeder Rangliste bekommen dieses Bonus-Einkommen pro Tag (Platz 1, 2, 3, 4, 5):
rankings:
  bonus: [10, 5, 3, 2, 1]
  # "Wenigste Tode" zählt nur Spieler mit mindestens so vielen Minuten Spielzeit
  min-playtime-minutes: 120
  # Wie oft die Statistiken der Online-Spieler eingelesen werden
  sync-seconds: 120

