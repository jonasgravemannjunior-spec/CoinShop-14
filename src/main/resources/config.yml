  enchant-cost-per-level:
    default: 600
    # --- Schutz und Rüstung ---
    protection: 1500
    fire_protection: 900
    blast_protection: 1250
    projectile_protection: 900
    feather_falling: 800
    thorns: 1000
    unbreaking: 1250
    respiration: 1000
