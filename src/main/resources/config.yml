# ---------------- Schlafen ----------------
# Schlafen genug aktive Spieler einer Welt (Prozent), läuft die Nacht im Zeitraffer ab (nur die Tageszeit,
# sonst ändert sich nichts). "Aktiv" = nicht im Zuschauer-Modus und nicht länger als afk-minutes bewegungslos.
sleep:
  enabled: true
  percent: 10
  # Wie viele Zeit-Ticks pro Server-Tick vergehen. 120 = eine ganze Nacht dauert höchstens 5 Sekunden
  # (kleinere Werte machen es langsamer, die Nacht dauert dann länger als 5 Sekunden)
  speed: 120
  afk-minutes: 5

# ---------------- Teleportieren ----------------
teleport:
  # Wartezeit vor jeder Teleportation (Sekunden)
  delay-seconds: 3
  # So lange ist eine /tpa-Anfrage gültig (Sekunden)
  request-timeout-seconds: 60

# ---------------- Freecam ----------------
freecam:
  enabled: true
  # So weit darf man sich von seinem Körper entfernen (Blöcke)
  max-distance: 100   # Radius in Blöcken (waagerecht); Höhe und Tiefe sind unbegrenzt

# ---------------- Coins allgemein ----------------
coins:
  # Größter Betrag, der auf einmal überwiesen werden darf (Schutz vor Tippfehlern)
  max-transfer: 1000000000
  # Einmaliges Startguthaben für Spieler, die zum allerersten Mal beitreten (0 = keins)
  start-bonus: 100

# ---------------- Login-Serie (Teil des täglichen Einkommens) ----------------
# Wer an mehreren Tagen hintereinander (Tag = 12:00 bis 12:00 Uhr) auf dem Server ist, bekommt einen
# Serien-Bonus auf sein tägliches Einkommen: per-day x (Tag der Serie - 1), höchstens bis max-days Tage.
# Jeder 7. Tag der Serie gibt zusätzlich weekly-bonus. Das Ganze wird mit dem Einkommen beim Shop-Wechsel
# ausgezahlt (Grundeinkommen steht unter daily-income).
login-streak:
  enabled: true
  per-day: 5
  max-days: 7
  weekly-bonus: 100

# ---------------- Tägliche Aufgaben ----------------
# Jeden Tag (Wechsel zur Shop-Zeit) gibt es für alle dieselben "count" Aufgaben aus dem Pool.
# amount = [kleinste, größte] Zielmenge, reward = [kleinste, größte] Belohnung (je größer die Aufgabe,
# desto größer die Belohnung). stat = was gezählt wird (mined, wood, stone, diamonds, fishing, creatures,
# walked, placed, trades, playtime). Wer alle Aufgaben des Tages schafft, bekommt zusätzlich bonus-all.
quests:
  enabled: true
  count: 3
  bonus-all: 60
  pool:
    mined:     {stat: mined,     name: "Blöcke abbauen",    unit: "Blöcke",   icon: DIAMOND_PICKAXE, amount: [200, 600],  reward: [20, 60]}
    wood:      {stat: wood,      name: "Holz sammeln",      unit: "Stämme",   icon: OAK_LOG,         amount: [40, 120],   reward: [20, 55]}
    stone:     {stat: stone,     name: "Stein abbauen",     unit: "Blöcke",   icon: COBBLESTONE,     amount: [150, 500],  reward: [15, 50]}
    diamonds:  {stat: diamonds,  name: "Diamanterze finden", unit: "Erze",    icon: DIAMOND_ORE,     amount: [3, 10],     reward: [40, 110]}
    fishing:   {stat: fishing,   name: "Angeln",            unit: "Fänge",    icon: FISHING_ROD,     amount: [10, 30],    reward: [20, 55]}
    creatures: {stat: creatures, name: "Kreaturen besiegen", unit: "Kreaturen", icon: IRON_SWORD,    amount: [15, 50],    reward: [20, 60]}
    walked:    {stat: walked,    name: "Weit wandern",      unit: "Blöcke",   icon: LEATHER_BOOTS,   amount: [1000, 3000], reward: [15, 45]}
    placed:    {stat: placed,    name: "Bauen",             unit: "Blöcke",   icon: BRICKS,          amount: [150, 500],  reward: [15, 50]}
    trades:    {stat: trades,    name: "Mit Dorfbewohnern handeln", unit: "Handel", icon: EMERALD,   amount: [3, 10],     reward: [30, 80]}

# ---------------- Titel ----------------
# Titel stehen in Chat und Tab-Liste vor dem Namen. Ein Spieler kann mehrere besitzen, trägt aber nur einen
# (Auswahl im Menü /titel). "color" ist ein Minecraft-Farbname (gold, aqua, red, green, dark_purple ...).
titles:
  richest: {name: "Goldkaiser", color: gold, icon: GOLD_INGOT}
  # Platz-1-Titel: gehört dem Ersten der Rangliste, solange er Erster ist
  rank:
    diamonds:     {name: "Diamantenfürst",     color: aqua}
    debris:       {name: "Höllenschürfer",   color: dark_purple}
    wood:         {name: "Waldschreck",       color: yellow}
    stone:        {name: "Felsflüsterer",        color: gray}
    fishing:      {name: "Köder-Casanova",     color: blue}
    creatures:    {name: "Henker der Nacht",   color: red}
    deaths-least: {name: "Unsterblicher", color: green}
    deaths-most:  {name: "Märtyrer",         color: dark_red}
    trades:       {name: "Smaragdbaron",          color: dark_green}
    walked:       {name: "Sohlen-Sultan",         color: dark_aqua}
    bosses:       {name: "Titanenbezwinger",    color: light_purple}
    placed:       {name: "Bob",       color: gold}
    mined:        {name: "Erdenbrecher",         color: dark_gray}
    playtime:     {name: "Dauerbrenner",      color: light_purple}
  # Dauerhafte Titel: einmal verdient, immer behalten.
  # type: streak (Login-Serie in Tagen), collections (fertige Kollektionen), secrets (geheime Erfolge),
  #       quests (geschaffte Aufgaben), coins (Kontostand), playtime (Spielzeit in Minuten)
  permanent:
    stammgast:        {name: "Treues Stück",        color: green,        icon: CLOCK,         type: streak,      value: 30}
    sammler:          {name: "Hamster",          color: yellow,       icon: BOOKSHELF,     type: collections, value: 10}
    geheimniskraemer: {name: "Geheimnisträger",  color: light_purple, icon: ENDER_EYE,     type: secrets,     value: 10}
    questmeister:     {name: "Rastloser Held",     color: aqua,         icon: WRITABLE_BOOK, type: quests,      value: 100}
    goldfinger:       {name: "Scheich",       color: gold,         icon: GOLD_BLOCK,    type: coins,       value: 100000}
    veteran:          {name: "Serverlegende",          color: red,          icon: SHIELD,        type: playtime,    value: 6000}

# ---------------- Lizenzen ----------------
# Einmal kaufen, für immer behalten. Genau diese 12 Kennungen gibt es (nicht umbenennen):
# "value" bedeutet je nach Lizenz etwas anderes (siehe Kommentar). Der Preis geht aufs Shop-Konto.
licenses:
  steuerfrei:    {name: "Steuerfrei",      icon: PAPER,           price: 20000, value: 0}    # keine Verkaufssteuer im Spieler-Shop
  gebuehrenfrei: {name: "Gebührenfrei",    icon: NAME_TAG,        price: 12000, value: 0}    # keine Einstellgebühr im Spieler-Shop
  freispiel:     {name: "Casino-Freispiel", icon: AMETHYST_SHARD, price: 10000, value: 1}    # ein Casino-Spiel pro Tag gratis
  rabatt:        {name: "Stammkunde",      icon: EMERALD,         price: 30000, value: 10}   # % Rabatt im Server-Shop
  rente:         {name: "Rentner",         icon: GOLD_INGOT,      price: 8000,  value: 40}   # Coins mehr pro Tag
  zusatzslots:   {name: "Marktstand",      icon: CHEST,           price: 6000,  value: 4}    # zusätzliche Verkaufs-Slots
  treue:         {name: "Treuekarte",      icon: CLOCK,           price: 12000, value: 50}   # % mehr Login-Serien-Bonus
  investor:      {name: "Investor",        icon: GOLD_BLOCK,      price: 25000, value: 10}   # % mehr Einkommen aus Item-Sets
  boersen:       {name: "Börsenhändler",   icon: DIAMOND,         price: 18000, value: 5}    # Börsen-Gebühr in % (statt 10 %)
  ranglisten:    {name: "Ruhmjäger",       icon: GOLDEN_HELMET,   price: 20000, value: 25}   # % mehr Bonus aus den Ranglisten
  aufgaben:      {name: "Fleißbiene",      icon: WRITABLE_BOOK,   price: 15000, value: 25}   # % mehr Belohnung bei Aufgaben
  sammler:       {name: "Sammelwut",       icon: BOOKSHELF,       price: 20000, value: 15}   # % mehr Belohnung bei Kollektionen

# ---------------- Sicherungen der Datenbank ----------------
# Eine Kopie von coinshop.db im Ordner plugins/CoinShop/backups. Beim Start, im Abstand von
# interval-hours und beim Ausschalten. Es bleiben nur die neuesten "keep" Dateien erhalten.
# Termine des Servers (Zeitzone wie beim Shop). Format: "JJJJ-MM-TT HH:MM"
schedule:
  server-start-enabled: true
  server-start: "2026-12-06 12:00"   # offizieller Start
  # Testphase: ab diesem Zeitpunkt dürfen alle beitreten, aber nur schauen:
  # Radius um den Spawn, keine Spawns, keine Tode, keine Coins/Erfolge/Belohnungen (Admins/OPs sind ausgenommen)
  preview-enabled: true
  preview-start: "2026-12-03 00:00"
  preview-radius: 500
  nether-enabled: true
  nether-open: "2026-12-10 12:00"    # vorher sind Nether-Portale gesperrt

# Safe-Zone um den Spawn (Hauptwelt), dauerhaft: nichts abbauen/bauen, keine Explosionen, kein Feuerschaden an Blöcken,
# keine neuen Monster/Tiere, kein Schaden und kein Hunger für Spieler. Admins dürfen bauen und abbauen.
safe-zone:
  enabled: true
  radius: 500
  block-place: true    # false = dort darf gebaut/platziert werden (nur Abbauen gesperrt)

# Voice-Chat-Mod (Simple Voice Chat): Sprache im Proximity-Chat ist im Spiel zu "hören"
voicechat:
  enabled: true
  sculk:
    enabled: true
    event: "note_block_play"   # Spielereignis, das Sculk-Sensoren wahrnehmen (z. B. step, entity_roar, projectile_shoot)
    cooldown-ticks: 20
    sneak-silent: true         # beim Schleichen sprechen = Sculk bleibt still (Flüstern ist immer still)
  mobs:
    enabled: true
    radius: 40                 # Monster hören dich in so vielen Blöcken (normal haben sie 16 bis 35)
    sneak-factor: 0.6          # Schleichen: Radius x 0,6
    whisper-factor: 0.15       # Flüstern: Radius x 0,15
    aggro-radius: 24           # innerhalb davon greifen sie direkt an, weiter weg laufen sie zur Quelle
    max-mobs: 10
    cooldown-ticks: 40
  warden:
    enabled: true
    radius: 32                 # der Wächter hört dich in so vielen Blöcken (Flüstern/Schleichen: Faktoren von mobs)
    anger: 30                  # so viel Wut pro Sprach-Impuls dazu (ab 80 greift er an)

backup:
  enabled: true
  interval-hours: 6
  keep: 20

# ---------------- Tägliches Einkommen ----------------
# Wird für JEDEN bekannten Spieler (auch offline) zusammen mit dem Shop-Wechsel ausgezahlt.
# Dazu kommt das Einkommen aus Investitions-Sets. Diese Coins werden neu erzeugt (nicht vom Shop-Konto genommen).
daily-income:
  base: 10

# ---------------- Server-Shop ----------------
server-shop:
  # Wie viele Angebote gleichzeitig (das Menü ist für 14 gebaut - nicht ändern)
  offers: 14
  # Zeitzone und Uhrzeit des täglichen Wechsels
  timezone: "Europe/Berlin"
  reset-hour: 12
  # Wie oft ein Spieler EIN Angebot pro Tag kaufen darf (0 = unbegrenzt)
  purchase-limit-per-offer: 3
  # Wie oft ein Angebot INSGESAMT (von allen Spielern zusammen) gekauft werden kann.
  # Ist ein Angebot ausverkauft, kommt an dessen Platz sofort ein neues Item.
  stock-per-offer: 3

  # Chance (0.0 bis 1.0), dass ein Angebotsplatz ein verzaubertes Rüstungsteil bzw. ein
  # Verzauberungsbuch ist. Der Rest sind normale Items.
  enchanted-armor-chance: 0.12
  # Chance für ein bereits verzaubertes Werkzeug oder eine verzauberte Waffe (Schwert, Axt, Spitzhacke,
  # Schaufel, Hacke, Bogen, Armbrust, Dreizack, Streitkolben, Angel)
  enchanted-tool-chance: 0.12
  enchanted-book-chance: 0.18

  # Item-Variationen (Tränke in allen Arten, Pfeile, Ziegenhörner, Eintopf, Ominöse Flaschen, Feuerwerk,
  # Axolotl- und Tropenfisch-Eimer, Rüstungsbesätze, gefärbte Lederrüstung, alle Verzauberungsbücher)
  variant-chance: 0.20
  variant-prices:
    goat_horn: 1500
    suspicious_stew: 300
    ominous_bottle: 600       # plus 300 je Stufe (0 bis 4)
    firework_rocket: 30       # plus 30 je Flugdauer, pro Rakete
    axolotl: 300
    axolotl_blue: 1500
    tropical_fish_bucket: 250
    armor_trim: 2500          # Aufschlag auf die Rüstung
    dyed_leather: 20
  # Grundpreis pro Trank (stark = x2,2, lang = x1,6; Wurftrank x1,4, Verweiltrank x2,2, Pfeil x0,3)
  potion-base:
    default: 250
    water: 20
    mundane: 40
    thick: 40
    awkward: 60
    healing: 300
    harming: 300
    swiftness: 250
    slowness: 150
    leaping: 200
    strength: 350
    weakness: 150
    poison: 200
    regeneration: 350
    fire_resistance: 300
    night_vision: 200
    invisibility: 250
    water_breathing: 250
    slow_falling: 250
    turtle_master: 500
    luck: 400
    wind_charged: 300
    weaving: 300
    oozing: 300
    infested: 300

  # Diese Items gibt es im Shop immer nur EINZELN (Menge 1). Mit * sind Gruppen möglich.
  single-only:
    - MAP

  # Wie stark teure Items seltener erscheinen. Gewicht = 1 / (1 + Preis / rarity-divisor).
  # Größerer Wert = teure Items erscheinen häufiger. Sehr großer Wert (z. B. 1000000) = alle gleich oft.
  rarity-divisor: 1000

  # Was Verzauberungen kosten (Coins PRO STUFE, bei Stufe 1). Der Name ist der Spielname der Verzauberung.
  # Alles, was hier fehlt, kostet "default".
  # - Hohe Stufen werden überproportional teurer (siehe enchant-level-exponent).
  # - Ein Buch kostet nur die Verzauberung (mindestens 250). Rüstung, Werkzeuge und Waffen kosten den
  #   Preis des Items + die Verzauberungen x den Material-Faktor (siehe enchant-material-factor).
  # - Verzauberungen, die man NICHT am Verzauberungstisch bekommt (mending, frost_walker, soul_speed,
  #   swift_sneak, wind_burst), sind besonders teuer.
